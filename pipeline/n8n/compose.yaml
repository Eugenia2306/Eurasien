# Not a separate production stack.
# Live coordinator is imported into /opt/salino-n8n and served at https://n8n.uwzghana.com/
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: n8n
    volumes:
      - eurasien_n8n_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n"]
      interval: 10s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:1.109.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:5681:5678"
    environment:
      N8N_HOST: ${N8N_HOST:-n8n.eurasiengesellschaft.de}
      N8N_PORT: "5678"
      N8N_PROTOCOL: ${N8N_PROTOCOL:-https}
      WEBHOOK_URL: ${WEBHOOK_URL:-https://n8n.eurasiengesellschaft.de/}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_SECURE_COOKIE: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      GENERIC_TIMEZONE: Europe/Berlin
      TZ: Europe/Berlin
      EG_WP_BASE: ${EG_WP_BASE}
      EG_WP_USER: ${EG_WP_USER}
      EG_WP_PASS: ${EG_WP_PASS}
      EG_WP_BASIC: ${EG_WP_BASIC}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - eurasien_n8n_data:/home/node/.n8n
      - ./eg-editorial-coordinator.json:/home/node/eg-editorial-coordinator.json:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  eurasien_n8n_postgres:
  eurasien_n8n_data:
